name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy reviewed local-save site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: poke-sim/package-lock.json

      - name: Validate local-only release before deploy
        run: |
          set -euo pipefail
          node -e "if(require('./poke-sim/release_manifest.js').data_mode !== 'local-only') throw Error('Connected releases require a separately reviewed deployment policy')"
          cd poke-sim
          npm ci
          npm test
          cd ..
          bash poke-sim/tools/check-bundle.sh

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Stage Pages artifact to match local repo layout
        run: |
          set -euo pipefail
          mkdir -p pages-dist/poke-sim
          cp index.html pages-dist/index.html
          cp .nojekyll pages-dist/.nojekyll
          runtime_files=(
            index.html pokemon-champion-2026.html style.css manifest.json sw.js
            icon-192.png icon-512.png release_manifest.js
            app_shell.js data.js engine.js legality_evidence_package.js legality.js
            logger.js move_legality.js move_support.js regmb_source_conversion.js mc_review.js
            replay_coach.js replay_import_service.js replay_learning.js rulesets.js
            runtime_data.js sim_evidence.js source_truth.js storage_adapter.js
            strategy-injectable.js supabase_adapter.js team_lab.js ui.js
          )
          for file in "${runtime_files[@]}"; do
            install -m 0644 "poke-sim/$file" "pages-dist/poke-sim/$file"
          done
          printf '%s\n' 'window.__DISABLE_SUPABASE__ = true;' > pages-dist/poke-sim/local-credentials.js
          cmp poke-sim/pokemon-champion-2026.html pages-dist/poke-sim/pokemon-champion-2026.html
          cp -R poke-sim/assets pages-dist/poke-sim/assets
          mkdir -p pages-dist/poke-sim/generated
          generated_files=(
            news_feed.js pokemon_showdown_legal_data.js champions_move_overrides.js
            champions_move_pools.js mc_review_reference.js
            pokemon_showdown_species_weights.js release_artifact.json
            source_registry.js source_sync_status.js tournament_catalog.js
            project_roadmap.js
          )
          for file in "${generated_files[@]}"; do
            install -m 0644 "poke-sim/generated/$file" "pages-dist/poke-sim/generated/$file"
          done
          test ! -e pages-dist/poke-sim/tests
          test ! -e pages-dist/poke-sim/db
          test ! -e pages-dist/poke-sim/reports
          test ! -e pages-dist/poke-sim/docs

      - name: Verify staged external release assets
        run: node poke-sim/tools/verify-release-assets.cjs pages-dist/poke-sim

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
          reporting_interval: 10000
