name: News Feed Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news-feed-sync
  cancel-in-progress: false

jobs:
  sync-news:
    if: github.repository == 'TheYfactora12/Pokemon-Champions-Sim-Planner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Clear previous source-health receipt
        run: rm -f poke-sim/reports/news-sync-health.json
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: poke-sim/package-lock.json
      - name: Install locked tooling
        working-directory: poke-sim
        run: npm ci
      - name: Sync approved public feeds
        run: node poke-sim/tools/sync-news-feed.mjs
      - name: Rebuild Champion sim bundle
        run: python3 poke-sim/tools/build-bundle.py
      - name: Validate news and app regression contracts
        working-directory: poke-sim
        run: npm run test:fast
      - name: Retain source health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-source-health
          path: poke-sim/reports/news-sync-health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish tested news artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fresh health receipt was uploaded above, not published as runtime data.
          git restore --source=HEAD -- poke-sim/reports/news-sync-health.json
          git add poke-sim/generated/news_feed.js poke-sim/pokemon-champion-2026.html poke-sim/generated/release_artifact.json
          # Tests or tooling must not introduce any other tracked mutation.
          git diff --name-only -z HEAD | node poke-sim/tools/news-review-policy.mjs --paths
          if git diff --cached --quiet; then
            echo "No feed artifact changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh tested Champions news"
            git diff --name-only -z HEAD^ HEAD | node poke-sim/tools/news-review-policy.mjs --paths
            gh auth setup-git
            # Never bypass a non-fast-forward or protected-branch rejection.
            git push origin HEAD:refs/heads/main
          fi
          echo "Tested news commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Request normal Pages validation and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger another push workflow.
          gh workflow run pages.yml --ref main
          echo "Pages requested; deployment success is reported by Deploy GitHub Pages, not this sync job." >> "$GITHUB_STEP_SUMMARY"
