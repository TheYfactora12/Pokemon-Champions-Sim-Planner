name: Free Disposable DB Isolation

on:
  pull_request:
    paths:
      - 'poke-sim/db/**'
      - '.github/workflows/free-db-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-isolation:
    # Standard public-repository runner only. No paid Supabase branch or secrets.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: champions_isolation
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d champions_isolation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '54329'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: champions_isolation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply explicit synthetic baseline
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f poke-sim/db/diagnostics/local_ci_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f poke-sim/db/migrations/2026_06_29_team_lab_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f poke-sim/db/migrations/2026_06_29_team_lab_sim_jobs_replays.sql
          psql -X -v ON_ERROR_STOP=1 -f poke-sim/db/migrations/20260924040135_team_lab_evidence_visibility.sql
      - name: Verify two-identity SQL isolation and rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -v security_disposable=true -f poke-sim/db/diagnostics/security_isolation_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f poke-sim/db/diagnostics/evidence_visibility_matrix.sql
          test "$(psql -X -Atc 'SELECT count(*) FROM public.team_lab_teams')" = '0'
          echo 'SQL isolation subset passed; synthetic claims only. Real Auth/HTTP, live production, full migration parity and additional privacy surfaces remain unverified.' >> "$GITHUB_STEP_SUMMARY"
